# DATABASE_URL (contains the DB password) comes from a Secret created
# imperatively via `kubectl create secret generic app-secret ...`, same
# reasoning as mlflow-deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: mlops
spec:
  replicas: 2  # two replicas: a pod restarting shouldn't cause a prediction outage
  selector:
    matchLabels:
      app: house-price-app
  template:
    metadata:
      labels:
        app: house-price-app
    spec:
      containers:
        - name: app
          image: docker-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: 750m, memory: 768Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: mlops
spec:
  selector:
    app: house-price-app
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: app-nodeport
  namespace: mlops
spec:
  type: NodePort
  selector:
    app: house-price-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
