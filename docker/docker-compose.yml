services:
  warehouse:
    image: postgres:16-alpine
    container_name: mlops_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      POSTGRES_DB: ${POSTGRES_DB:-house_prices}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops} -d ${POSTGRES_DB:-house_prices}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1
    container_name: mlops_adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      - warehouse

volumes:
  warehouse_data:
